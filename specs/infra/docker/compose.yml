# The mstr-specs stack — local development, CI, and the ds1 deploy.
#
#   local:  make up
#   ds1:    the deploy-ds1 workflow, which adds compose.ds1.networks.yml and an --env-file
#
# Every value comes from ${VAR} interpolation with a local-dev default inline, so the same file
# serves both without a separate override for the common case.

name: mstr-specs

services:
  # A SINGLE-NODE REPLICA SET, not a standalone mongod.
  #
  # The transactional outbox needs multi-document transactions and those need a replica set, so a
  # standalone deployment is not a supported configuration — including in development. It would
  # answer every ordinary read and write happily and then refuse the one thing the outbox exists to
  # do, which is the worst possible moment to find out. The api asserts this at boot.
  mongo:
    image: mongo:7
    restart: unless-stopped
    # A keyfile is not optional here. MongoDB refuses to start with authorisation enabled *and*
    # replication enabled unless internal authentication is configured — even for one member. It is
    # generated on first boot into its own volume rather than committed, because a keyfile in a
    # repository is a credential in a repository.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ ! -s /etc/mongo-key/keyfile ]; then
          openssl rand -base64 756 > /etc/mongo-key/keyfile
        fi
        chmod 400 /etc/mongo-key/keyfile
        chown mongodb:mongodb /etc/mongo-key/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-key/keyfile
    networks:
      default:
        # A UNIQUE hostname, deliberately not the service name. On ds1 the api also joins
        # identity-service's network, where a container is aliased `mongo` too — and Docker's DNS
        # answers across every attached network, so plain `mongo` can resolve to *their* database.
        # That presents as "Authentication failed" and looks like a wrong password rather than a
        # wrong server.
        aliases:
          - mstr-specs-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-specs}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-specs}
    ports:
      # Loopback-bound, and 27019 rather than the default so it collides with neither a developer's
      # own MongoDB nor skills-coach's 27018.
      - "${MONGO_BIND:-127.0.0.1}:${MONGO_PORT:-27019}:27017"
    volumes:
      - specs-mongodata:/data/db
      - specs-mongokey:/etc/mongo-key
    healthcheck:
      # `hello().setName` rather than `ping`: a standalone answers ping, and the difference between
      # "running" and "running as a replica set" is the whole point of this service's shape.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.hello().setName === 'rs0' || quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot. Initiates the replica set on an empty volume and exits; on an initiated one it is a
  # no-op, so it is safe on every deploy rather than only the first.
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_started
    environment:
      MONGO_USER: ${MONGO_USER:-specs}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-specs}
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for i in $$(seq 1 60); do
          if mongosh --host mstr-specs-mongo --quiet -u "$$MONGO_USER" -p "$$MONGO_PASSWORD" \
               --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        mongosh --host mstr-specs-mongo --quiet -u "$$MONGO_USER" -p "$$MONGO_PASSWORD" \
          --authenticationDatabase admin --eval '
            try {
              rs.status();
              print("replica set already initiated");
            } catch (e) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mstr-specs-mongo:27017" }] });
              print("replica set initiated");
            }
          '

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-specsminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-specsminio}
    ports:
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_PORT:-9020}:9000"
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9021}:9001"
    volumes:
      - specs-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot bucket creation. Attachments are content-addressed under a prefix per workspace, so
  # object storage mirrors the database isolation rather than being the one place a workspace
  # boundary is a naming convention.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-specsminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-specsminio}
      S3_BUCKET: ${S3_BUCKET:-mstr-specs}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: mstr-specs-api:${IMAGE_TAG:-dev}
    container_name: mstr-specs-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      SPECS_ENV: ${SPECS_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The URI carries no credentials; the driver receives them separately, so nothing needs
      # percent-encoding and a password containing @ or # cannot corrupt the connection string.
      MONGO_URI: ${MONGO_URI:-mongodb://mstr-specs-mongo:27017/?replicaSet=rs0}
      MONGO_USER: ${MONGO_USER:-specs}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-specs}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      MONGO_CONTROL_DB: ${MONGO_CONTROL_DB:-specs_control}
      MONGO_DB_PREFIX: ${MONGO_DB_PREFIX:-ws}
      # `dev` injects a stub principal so the stack runs with no identity provider. The api refuses
      # this combination when SPECS_ENV/NODE_ENV say production (src/config.ts).
      AUTH_MODE: ${AUTH_MODE:-dev}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      CATALOGUE_WORKSPACE: ${CATALOGUE_WORKSPACE:-catalogue}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-mstr-specs}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-specsminio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-specsminio}
      RECORD_SINK: ${RECORD_SINK:-local}
      RECORD_SINK_URL: ${RECORD_SINK_URL:-}
      EVALUATOR_BASE: ${EVALUATOR_BASE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8020}:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  # The console. Loopback-bound; on ds1 the shared reverse proxy fronts the domain and routes `/`
  # here. It needs no `/api` rule: the Next server proxies `/api/*` to the api service itself, and
  # that is what can turn the httpOnly session cookie into an Authorization header.
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${WEB_API_BASE_URL:-/api}
        NEXT_PUBLIC_AUTH_MODE: ${WEB_AUTH_MODE:-dev}
        NEXT_PUBLIC_IDENTITY_BASE_URL: ${WEB_IDENTITY_BASE_URL:-}
        NEXT_PUBLIC_IDENTITY_CLIENT_ID: ${WEB_IDENTITY_CLIENT_ID:-}
        NEXT_PUBLIC_DEFAULT_WORKSPACE: ${WEB_DEFAULT_WORKSPACE:-aannemer-x}
    image: mstr-specs-web:${IMAGE_TAG:-dev}
    container_name: mstr-specs-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8021}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/sign-in',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  specs-mongodata:
  specs-mongokey:
  specs-miniodata:
