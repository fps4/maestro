name: docs
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link integrity
        run: scripts/check-links.sh
      - name: Public-repository guards
        env:
          FORBIDDEN_PATTERNS_FILE: ${{ runner.temp }}/forbidden.txt
        run: |
          printf '%s\n' "${{ secrets.FORBIDDEN_PATTERNS }}" > "$FORBIDDEN_PATTERNS_FILE"
          scripts/check-public.sh
