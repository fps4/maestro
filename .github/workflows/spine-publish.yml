name: spine-publish

# Publishes @fps4/maestro-spine to npm on a tag `spine-v<version>`, through npm's trusted
# publishing: GitHub's OIDC token is the credential, provenance is attached automatically, and no
# npm token exists anywhere. The trusted publisher on npmjs.com names this repository, this
# workflow file and the `npm` environment. The tag must match package.json's version.

on:
  push:
    tags: ['spine-v*']

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: spine

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: spine/package-lock.json
      - name: npm ≥ 11.5.1 (trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: The tag names the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "spine-v${version}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but package.json says ${version}"; exit 1; }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The tarball imports on its own
        # What `files` leaves out is invisible to the tests, which import from src. Pack, unpack,
        # install, import: the published module resolves every export or nothing is published.
        run: |
          dir="$(mktemp -d)"
          npm pack --pack-destination "$dir" >/dev/null
          tar xzf "$dir"/*.tgz -C "$dir"
          (cd "$dir/package" && npm install --omit=dev --ignore-scripts >/dev/null && node -e "import('./dist/index.js').then(m => console.log('imports ok:', Object.keys(m).length, 'exports'))")
      - name: Publish
        # npm's OIDC exchange never throws: a missing or mismatched trusted publisher falls through to
        # setup-node's placeholder token, and the registry answers the PUT with a bare 404. At verbose
        # the exchange's own failure is in the log (`oidc: Failed token exchange request …`).
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish --access public
