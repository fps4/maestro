name: console
on:
  pull_request:
    paths: ['console/**', '.github/workflows/console.yml']
  push:
    branches: [main]
    paths: ['console/**', '.github/workflows/console.yml']
jobs:
  web:
    # The console (ADR-0023): building its image runs typecheck, lint, tests and the production
    # build (infra/docker/web.Dockerfile). The tag is per run and removed afterwards.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mc-web:${{ github.run_id }}-${{ github.run_attempt }} -f console/infra/docker/web.Dockerfile console
      - name: Cleanup
        if: always()
        run: docker rmi "mc-web:${{ github.run_id }}-${{ github.run_attempt }}" 2>/dev/null || true

  dependency-scan:
    # Known vulnerabilities in what the console ships. High and above fails; the report is printed
    # either way so a moderate finding is visible without blocking.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev || true
      - run: npm audit --omit=dev --audit-level=high

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - name: Module tests (mocked providers, both configurations)
        run: terraform test
      # The module declares configuration_aliases, which `terraform validate` cannot satisfy in the
      # module's own directory; the example root passes both configurations and validates the module
      # as its child.
      - name: Module and example root validate
        working-directory: console/terraform/examples/demo
        run: terraform init -backend=false -input=false && terraform validate
