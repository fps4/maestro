name: spine
on:
  pull_request:
    paths: ['spine/**', '.github/workflows/spine.yml']
  push:
    branches: [main]
    paths: ['spine/**', '.github/workflows/spine.yml']
defaults:
  run:
    working-directory: spine
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spine/package-lock.json
      - run: npm ci
      - name: Dependencies (build-standards §3)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Lambda bundle
        run: npm run bundle
      - name: SBOM (build-standards §4)
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: spine-sealer
          path: |
            spine/dist/lambda/sealer.zip
            spine/dist/lambda/sealer.cdx.json
          if-no-files-found: error
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spine/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Module tests (mocked provider)
        run: terraform test
      - name: Example root validates
        working-directory: spine/terraform/examples/demo
        run: terraform init -backend=false -input=false && terraform validate
